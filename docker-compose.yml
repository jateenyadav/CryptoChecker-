# Local full-stack dev/prod parity: Postgres + Django API + built frontend.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: cryptochecker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      SECRET_KEY: dev-compose-secret
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://crypto:crypto@db:5432/cryptochecker
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Point the built SPA at the API service.
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
